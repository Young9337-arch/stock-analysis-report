name: Refresh foreign market data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update verified foreign data snapshot
        run: python scripts/update_foreign_market_data.py
      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/foreign-securities.js
          git diff --cached --quiet || git commit -m "Refresh foreign market data"
          git push
